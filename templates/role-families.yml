# Role families: ready-made `title_filter.positive` keywords by kind of work.
#
# `select-portals.mjs --roles sysadmin-devops,ai-ml` appends these keywords to a
# person's own `title_filter.positive` (never removes or edits an existing one).
# The employers a person scans come from the catalog's `sectors` / `regions` tags;
# the roles it keeps come from the title filter, so the two are chosen together.
#
# Matching follows `title_filter` in portals.yml: a plain entry is a
# case-insensitive substring, a 2-3 letter entry (SRE, VR, QA) matches on word
# boundaries, and `word:` demands a whole word at any length. Spanish titles are
# listed next to the English ones because the same posting is often written either way.
# Brazilian Portuguese is listed too, with the masculine and feminine form of Engenheiro/
# Engenheira written out: the match is a substring, so one does not find the other.
#
# Keep a family to the titles that really name the work. A broad word (Engineer,
# Developer, Analyst alone) floods the inbox, and every extra keyword is a title
# the zero-token triage then has to throw away.

families:
  sysadmin-devops:
    label: Systems administration, DevOps, SRE, cloud and platform
    positive:
      - DevOps
      - SRE
      - Site Reliability
      - Platform Engineer
      - Infrastructure Engineer
      - Infrastructure Lead
      - Systems Engineer
      - System Administrator
      - Sysadmin
      - Linux
      - Cloud Engineer
      - Reliability Engineer
      - Automation Engineer
      - Observability
      - Kubernetes
      - word:NOC
      - Administrador de Sistemas
      - Administrador de Servidores
